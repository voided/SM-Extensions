name: LoadSoundScript CI

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'LoadSoundScript/**'
      - '.github/workflows/load-soundscript.yml'
      - '.github/workflows/_extension-ci.yml'
      - '.github/scripts/**'
      - 'build-support/**'
  pull_request:
    branches: [main, 'feature/**']
    paths:
      - 'LoadSoundScript/**'
      - '.github/workflows/load-soundscript.yml'
      - '.github/workflows/_extension-ci.yml'
      - '.github/scripts/**'
      - 'build-support/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/_extension-ci.yml
    permissions:
      contents: write
    with:
      project: LoadSoundScript
      sdk: true
      metamod: true
