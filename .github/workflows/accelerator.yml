name: Accelerator CI

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'Accelerator/**'
      - '.github/workflows/accelerator.yml'
      - '.github/workflows/_extension-ci.yml'
      - '.github/scripts/**'
      - 'build-support/**'
      - '.gitmodules'
  pull_request:
    branches: [main, 'feature/**']
    paths:
      - 'Accelerator/**'
      - '.github/workflows/accelerator.yml'
      - '.github/workflows/_extension-ci.yml'
      - '.github/scripts/**'
      - 'build-support/**'
      - '.gitmodules'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/_extension-ci.yml
    permissions:
      contents: write
    with:
      project: Accelerator
      submodule: Accelerator/third_party
