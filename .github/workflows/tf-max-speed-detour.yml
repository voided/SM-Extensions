name: TFMaxSpeedDetour CI

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'TFMaxSpeedDetour/**'
      - '.github/workflows/tf-max-speed-detour.yml'
      - '.github/workflows/_extension-ci.yml'
      - '.github/scripts/**'
      - 'build-support/**'
      - '.gitmodules'
      - 'third_party/safetyhook'
      - 'third_party/safetyhook/**'
  pull_request:
    branches: [main, 'feature/**']
    paths:
      - 'TFMaxSpeedDetour/**'
      - '.github/workflows/tf-max-speed-detour.yml'
      - '.github/workflows/_extension-ci.yml'
      - '.github/scripts/**'
      - 'build-support/**'
      - '.gitmodules'
      - 'third_party/safetyhook'
      - 'third_party/safetyhook/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/_extension-ci.yml
    permissions:
      contents: write
    with:
      project: TFMaxSpeedDetour
      sdk: true
      submodule: third_party/safetyhook
      metamod: true
