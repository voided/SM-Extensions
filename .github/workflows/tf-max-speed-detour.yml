name: TFMaxSpeedDetour CI

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'TFMaxSpeedDetour/**'
      - '.github/workflows/tf-max-speed-detour.yml'
      - '.github/workflows/_extension-ci.yml'
      - '.github/scripts/**'
      - 'build-support/**'
  pull_request:
    branches: [main, 'feature/**']
    paths:
      - 'TFMaxSpeedDetour/**'
      - '.github/workflows/tf-max-speed-detour.yml'
      - '.github/workflows/_extension-ci.yml'
      - '.github/scripts/**'
      - 'build-support/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/_extension-ci.yml
    permissions:
      contents: write
    with:
      project: TFMaxSpeedDetour
      # The upstream gamedata has only 32-bit signature keys.
      architectures: '["x86"]'
      sdk: true
      metamod: true
