name: Webcon CI

on:
  push:
    branches: [main, 'feature/**']
    paths:
      - 'Webcon-Conplex/**'
      - '.github/workflows/webcon.yml'
      - '.github/workflows/_extension-ci.yml'
      - '.github/scripts/**'
      - 'build-support/**'
  pull_request:
    branches: [main, 'feature/**']
    paths:
      - 'Webcon-Conplex/**'
      - '.github/workflows/webcon.yml'
      - '.github/workflows/_extension-ci.yml'
      - '.github/scripts/**'
      - 'build-support/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/_extension-ci.yml
    permissions:
      contents: write
    with:
      project: Webcon
      platforms: '[{"os_name":"linux","runner":"ubuntu-latest","container":"ghcr.io/alliedmodders/build-containers/debian11-clang22:latest","python":"python3"}]'
