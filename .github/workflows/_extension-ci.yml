name: Build and release extension

on:
  workflow_call:
    inputs:
      project:
        type: string
        required: true
      architectures:
        type: string
        default: '["x86", "x86_64"]'
      # A JSON array of runner configurations; callers can omit unsupported OSes.
      platforms:
        type: string
        default: '[{"os_name":"linux","runner":"ubuntu-latest","container":"ghcr.io/alliedmodders/build-containers/debian11-clang22:latest","python":"python3"},{"os_name":"windows","runner":"windows-latest","python":"python"}]'
      sdk:
        type: boolean
        default: false
      metamod:
        type: boolean
        default: false
      submodule:
        type: string
        default: ''
      plugin:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute version
        id: compute
        env:
          PROJECT: ${{ inputs.project }}
        run: |
          version=$(python3 .github/scripts/build_extension.py version "$PROJECT")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build-plugin:
    if: inputs.plugin != ''
    name: Plugin for SM ${{ matrix.sm.label }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sm:
          - label: '1.12'
            branch: 1.12-dev
          - label: '1.13'
            branch: master
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compile bundled SourcePawn plugin
        env:
          PROJECT: ${{ inputs.project }}
          PLUGIN: ${{ inputs.plugin }}
          SM_BRANCH: ${{ matrix.sm.branch }}
        run: |
          git clone --depth 1 --branch "$SM_BRANCH" https://github.com/alliedmodders/sourcemod.git sourcemod
          mkdir compiled
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -w /work \
            "ghcr.io/alliedmodders/sourcemod-spcomp:$SM_BRANCH" \
            -i "$PROJECT/scripting/include" -i sourcemod/plugins/include \
            "$PROJECT/scripting/$PLUGIN.sp" -o "compiled/$PLUGIN.smx"
          test -s "compiled/$PLUGIN.smx"
      - uses: actions/upload-artifact@v7
        with:
          name: plugin-${{ inputs.project }}-sm${{ matrix.sm.label }}
          path: compiled/*.smx
          if-no-files-found: error

  build:
    needs: [version, build-plugin]
    if: always() && needs.version.result == 'success' && (needs.build-plugin.result == 'success' || needs.build-plugin.result == 'skipped')
    name: sm${{ matrix.sm.label }}-${{ matrix.target.os_name }}-${{ matrix.arch }}
    runs-on: ${{ matrix.target.runner }}
    container: ${{ matrix.target.container }}
    strategy:
      fail-fast: false
      matrix:
        sm:
          - label: '1.12'
            branch: 1.12-dev
          - label: '1.13'
            branch: master
        target: ${{ fromJSON(inputs.platforms) }}
        arch: ${{ fromJSON(inputs.architectures) }}
    env:
      PROJECT: ${{ inputs.project }}
      SM_BRANCH: ${{ matrix.sm.branch }}
      ARCH: ${{ matrix.arch }}
      PYTHON: ${{ matrix.target.python }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Python (Windows)
        if: runner.os == 'Windows'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Setup MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'x86_64' && 'amd64' || 'x86' }}
      - name: Install AMBuild 2 (Windows)
        if: runner.os == 'Windows'
        run: python -m pip install git+https://github.com/alliedmodders/ambuild.git
      - name: Select compiler (Linux)
        if: runner.os == 'Linux'
        run: |
          echo 'CC=clang-22' >> "$GITHUB_ENV"
          echo 'CXX=clang++-22' >> "$GITHUB_ENV"
          python3 -c 'from ambuild2 import run'
      - name: Install Accelerator Linux dependencies
        if: runner.os == 'Linux' && inputs.project == 'Accelerator'
        run: |
          dpkg --add-architecture i386
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --allow-downgrades \
            linux-libc-dev/bullseye linux-libc-dev:i386/bullseye zstd
      - name: Initialize extension dependencies
        if: inputs.submodule != ''
        env:
          SUBMODULE: ${{ inputs.submodule }}
        run: git submodule update --init --recursive -- "$SUBMODULE"
      - name: Clone dependencies
        env:
          USE_SDK: ${{ inputs.sdk }}
          USE_METAMOD: ${{ inputs.metamod }}
        run: |
          mkdir deps
          git clone --depth 1 --recurse-submodules --shallow-submodules -j8 \
            --branch "$SM_BRANCH" https://github.com/alliedmodders/sourcemod.git deps/sourcemod
          if [ "$USE_METAMOD" = true ]; then
            git clone --depth 1 --recurse-submodules --shallow-submodules -j8 \
              --branch 1.12-dev https://github.com/alliedmodders/metamod-source.git deps/metamod-source
          fi
          if [ "$USE_SDK" = true ]; then
            git clone --depth 1 --branch tf2 https://github.com/alliedmodders/hl2sdk.git deps/hl2sdk-tf2
          fi
      - name: Build with AMBuild 2
        run: |
          "$PYTHON" .github/scripts/build_extension.py build "$PROJECT" --arch "$ARCH"
      - name: Resolve package directory
        id: package
        run: |
          package="$PROJECT/build/package"
          if [ "$PROJECT" = LoadSoundScript ]; then
            package="$PROJECT/build/loadsoundscript"
          fi
          echo "path=$package" >> "$GITHUB_OUTPUT"
      - name: Download bundled plugin
        if: inputs.plugin != ''
        uses: actions/download-artifact@v8
        with:
          name: plugin-${{ inputs.project }}-sm${{ matrix.sm.label }}
          path: ${{ steps.package.outputs.path }}/addons/sourcemod/plugins
      - name: Verify package
        env:
          BUILD_OS_NAME: ${{ matrix.target.os_name }}
        run: |
          "$PYTHON" .github/scripts/build_extension.py verify "$PROJECT" --arch "$ARCH" --platform "$BUILD_OS_NAME"
      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: pkg-${{ inputs.project }}-${{ needs.version.outputs.version }}-sm${{ matrix.sm.label }}-${{ matrix.target.os_name }}-${{ matrix.arch }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

  release:
    name: Release
    needs: [version, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.project }}-${{ github.sha }}
    env:
      PROJECT: ${{ inputs.project }}
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download build packages
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: pkg-${{ inputs.project }}-*
      - name: Assemble release archives
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          mapfile -t arches < <(jq -r '.[]' <<< "$ARCHITECTURES")
          mapfile -t platforms < <(jq -r '.[].os_name' <<< "$PLATFORMS")
          python3 .github/scripts/release_packages.py "$PROJECT" "$VERSION" \
            --architectures "${arches[@]}" --platforms "${platforms[@]}"
      - name: Publish release
        run: |
          tag="$PROJECT-v$VERSION"
          assets=(assets/*)
          expected=$(jq -n --args '$ARGS.positional' "${assets[@]##*/}")
          tagged_commit=$(git rev-parse --verify --quiet "refs/tags/$tag^{commit}" || true)
          if [[ -n "$tagged_commit" && "$tagged_commit" != "$GITHUB_SHA" ]]; then
            echo "::error::$tag already points to a different commit."
            exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > release.json 2>/dev/null; then
            if [[ "$tagged_commit" == "$GITHUB_SHA" ]] && jq -e --argjson expected "$expected" \
              '.isDraft == false and (($expected - [.assets[].name]) | length == 0)' release.json > /dev/null; then
              echo "Release $tag already has all archives."
              exit 0
            fi
            echo "::error::Existing release $tag is not complete for this commit."
            exit 1
          fi
          gh release create "$tag" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$PROJECT $VERSION" --latest=false \
            --notes "Automated $PROJECT release built from $GITHUB_SHA. Choose the archive for your SourceMod version and server OS."
